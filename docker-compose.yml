services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-negotiation_lab}
      POSTGRES_USER: ${POSTGRES_USER:-negotiation_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negotiation_lab_dev}
    volumes:
      - negotiation_lab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-negotiation_lab}:${POSTGRES_PASSWORD:-negotiation_lab_dev}@db:5432/${POSTGRES_DB:-negotiation_lab}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-negotiation_lab_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      GUEST_USER_ID: ${GUEST_USER_ID:-guest}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ANONYMOUS_SESSION_DAYS: ${ANONYMOUS_SESSION_DAYS:-7}
      PERSIST_USER_SCENARIO_CONTEXT: ${PERSIST_USER_SCENARIO_CONTEXT:-false}
      UNIKEY_API_KEY: ${UNIKEY_API_KEY:-}
      UNIKEY_BASE_URL: ${UNIKEY_BASE_URL:-https://www.getunikey.ai/v1}
      DIALOG_MODEL: ${DIALOG_MODEL:-google/gemini-3.1-flash-lite}
      SMART_MODEL: ${SMART_MODEL:-deepseek/deepseek-v4-pro}
      DIALOG_MODEL_FALLBACKS: ${DIALOG_MODEL_FALLBACKS:-google/gemini-3.5-flash,openai/gpt-5.2-mini,anthropic/claude-4.5-haiku}
      SMART_MODEL_FALLBACKS: ${SMART_MODEL_FALLBACKS:-google/gemini-3.5-flash,deepseek/deepseek-v3.2,openai/gpt-5.2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "${APP_PORT:-8000}:8000"
volumes:
  negotiation_lab_pgdata:
