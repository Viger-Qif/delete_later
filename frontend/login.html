<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <title>Вход — Negotiation Lab</title>
  <link rel="stylesheet" href="/static/css/base.css?v=29"><link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
  <header class="header"><div class="container header__inner">
    <a class="brand" href="index.html"><span class="brand__logo">N</span><span class="brand__name">Negotiation Lab</span></a>
  </div></header>
  <main class="auth-page"><section class="auth-card">
    <p class="page-eyebrow">Ваш прогресс</p>
    <h1>Войти в аккаунт</h1>
    <p class="auth-card__sub">Сценарии, результаты и история будут сохранены за вами.</p>
    <form data-auth-form data-auth-mode="login" class="auth-form">
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label>
      <p class="auth-error" data-auth-error></p>
      <button class="btn btn--primary" type="submit">Войти</button>
    </form>
    <p class="auth-footer">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
  </section></main>
  <script src="/static/js/app.js?v=27"></script><script src="/static/js/auth.js"></script>
</body>
</html>
