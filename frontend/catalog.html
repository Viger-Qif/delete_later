<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/static/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
<title>Каталог сценариев — тренажёр переговоров</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/base.css?v=29" rel="stylesheet"/>
<link href="/static/css/tour.css?v=5" rel="stylesheet"/>
<link href="/static/css/catalog.css" rel="stylesheet"/>
</head>
<body>
<!-- Шапка одинаковая на всех страницах -->
<header class="header">
<div class="container header__inner">
<a aria-label="На главную" class="brand" href="index.html">
<span aria-hidden="true" class="brand__logo">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18">
<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>
</span>
<span class="brand__name">Negotiation Lab</span>
</a>
<nav aria-label="Разделы" class="handbook-nav"><a aria-current="page" class="is-active" href="catalog.html">Сценарии</a><a href="handbook.html">Справочник</a><a href="scenario-studio.html">Создать сценарий</a><a href="profile.html">Профиль</a></nav>
</div>
</header>
<div class="container page-head">

<h1 class="page-head__title">Каталог сценариев</h1>
</div>
<main class="container catalog">
<!-- Фильтры: группы читаются JS через data-group и value чекбоксов -->
<aside aria-label="Фильтры поиска" class="filters" data-reveal="">
<h2 class="filters__title">Фильтры</h2>
<div class="filters__group" data-group="difficulty">
<p class="filters__group-title">Сложность</p>
<label class="check"><input type="checkbox" value="easy"/> Лёгкий</label>
<label class="check"><input type="checkbox" value="mid"/> Средний</label>
<label class="check"><input type="checkbox" value="hard"/> Сложный</label>
</div>
<div class="filters__group" data-group="topic">
<p class="filters__group-title">Тема</p>
<label class="check"><input type="checkbox" value="sales"/> Продажи</label>
<label class="check"><input type="checkbox" value="procurement"/> Закупки</label>
<label class="check"><input type="checkbox" value="hr"/> Найм и HR</label>
<label class="check"><input type="checkbox" value="conflict"/> Конфликты</label>
</div>
<button class="btn btn--ghost filters__reset" id="filters-reset" type="button">Сбросить</button>
</aside>
<div class="catalog__main" data-reveal="">
<label class="search">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24" width="16">
<circle cx="11" cy="11" r="7"></circle>
<line x1="21" x2="16.5" y1="21" y2="16.5"></line>
</svg>
<input id="scenario-search" maxlength="200" placeholder="Поиск по названию или описанию" type="search"/>
</label>
<p class="list-meta" id="list-meta"></p>
<div class="scenario-list" id="scenario-list" role="list"></div>
</div>
</main>
<script src="/static/js/data.js?v=25"></script>
<script src="/static/js/app.js?v=27"></script>
<script src="/static/js/catalog.js"></script>
<script src="/static/js/tour.js?v=6"></script>
<script src="/static/js/page-tours.js?v=4"></script>
</body>
</html>
