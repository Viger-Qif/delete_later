<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/static/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
<title>История переговоров</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/static/css/base.css?v=29" rel="stylesheet"/>
<link href="/static/css/stats.css" rel="stylesheet"/>
<link href="/static/css/tour.css?v=5" rel="stylesheet"/>
</head>
<body>
<header class="header">
<div class="container header__inner">
<a aria-label="На главную" class="brand" href="index.html">
<span aria-hidden="true" class="brand__logo">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18">
<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>
</span>
<span class="brand__name">Negotiation Lab</span>
</a>
</div>
</header>
<div class="container page-head">

<h1 class="page-head__title">История переговоров</h1>
</div>
<main class="container stats-page">
<!-- Сводка за всё время -->
<section class="stats-summary" data-reveal="">
<div class="stats-grid">
<div class="stat-card">
<span class="stat-card__label">Переговоров</span>
<span class="stat-card__value" id="sum-total">—</span>
</div>
<div class="stat-card">
<span class="stat-card__label">Средний балл</span>
<span class="stat-card__value" id="sum-score">—</span>
</div>
<div class="stat-card">
<span class="stat-card__label">Средний интерес</span>
<span class="stat-card__value" id="sum-interest">—</span>
</div>
<div class="stat-card">
<span class="stat-card__label" title="Оценка: 1,2 минуты на реплику пользователя; это не секундомер и паузы не измеряются.">Оценка времени · 1,2 мин/реплику</span>
<span class="stat-card__value" id="sum-time">—</span>
</div>
</div>
<div class="spark-wrap">
<p class="spark-title">Интерес в последних сессиях</p>
<div class="spark" id="spark"></div>
</div>
</section>
<!-- Список сохранённых сессий -->
<section data-reveal="">
<div class="stats-list-head">
<h2>Сохранённые сессии</h2>
<span class="stats-list-count" id="list-count"></span>
</div>
<div class="stats-list" id="sessions-list"></div>
</section>
</main>
<script src="/static/js/data.js?v=29"></script>
<script src="/static/js/app.js?v=27"></script>
<script src="/static/js/stats.js"></script>
<script src="/static/js/tour.js?v=6"></script>
<script src="/static/js/page-tours.js?v=4"></script>
</body>
</html>
