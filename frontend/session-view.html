<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/static/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
<title>Разбор сессии</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- results.css даёт готовые стили разбора: breakdown, moments, recommend -->
<link href="/static/css/base.css?v=29" rel="stylesheet"/>
<link href="/static/css/results.css" rel="stylesheet"/>
<link href="/static/css/session-view.css" rel="stylesheet"/>
</head>
<body>
<header class="header">
<div class="container header__inner">
<a aria-label="На главную" class="brand" href="index.html">
<span aria-hidden="true" class="brand__logo">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18">
<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>
</span>
<span class="brand__name">Negotiation Lab</span>
</a>
</div>
</header>
<div class="container page-head">

<h1 class="page-head__title" id="view-title">Разбор сессии</h1>
</div>
<main class="container results">
<article class="results__card" id="view-card">
<!-- метки: режим, дата, ходы, баллы, итог -->
<section class="view-meta" id="view-meta"></section>
<!-- переключатель вида -->
<div class="view-toggle">
<div aria-label="Вид разбора" class="segmented" id="view-toggle" role="tablist">
<button aria-selected="true" class="segmented__btn is-active" data-view="chat" role="tab" type="button">Чат</button>
<button aria-selected="false" class="segmented__btn" data-view="graph" role="tab" type="button">График</button>
</div>
</div>
<!-- диалог в виде чата -->
<section class="replay-wrap" id="view-chat">
<div class="replay" id="replay-log"></div>
</section>
<!-- диалог в виде графика интереса -->
<section class="graph-wrap" hidden="" id="view-graph">
<div class="graph" id="graph-box"></div>
<p class="graph__note">Интерес собеседника по ходам диалога</p>
</section>
<!-- итог: что получилось, над чем работать, моменты, рекомендация -->
<div id="view-analysis"></div>
<div class="result-actions">
<a class="btn btn--primary" href="catalog.html" id="view-retry">Повторить сценарий</a>
<a class="btn btn--secondary" href="stats.html">К истории</a>
</div>
</article>
</main>
<script src="/static/js/data.js?v=28"></script>
<script src="/static/js/app.js?v=27"></script>
<script src="/static/js/session-view.js"></script>
</body>
</html>
